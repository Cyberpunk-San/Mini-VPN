# minivpn server configuration. Normally created by: minivpn-admin init --endpoint <host>
endpoint = vpn.example.com      # public host/IP that devices connect to (used in device configs)
# listen = 0.0.0.0              # local address to bind
port = 51900                    # UDP; open it in your firewall
subnet = 10.8.0.0/24            # tunnel network; the server is .1
mtu = 1400
interface = mvpn0
client_to_client = yes          # let devices reach each other
user = minivpn                  # drop root to this user after start-up
devices = /etc/minivpn/devices
license = /etc/minivpn/license.key
control_socket = /run/minivpn/control.sock
